name: Daily Rep Report

on:
  schedule:
    # GitHub cron is UTC. 14:00 UTC = 7:00 AM Pacific (PDT).
    # Winter (PST) that becomes 6:00 AM — change to 15 if you care.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email; just upload the PNG + CSV as artifacts)"
        type: boolean
        default: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Check out the leaderboard page
        run: git clone --depth 1 -b claude/new-session-bczgqj https://github.com/matijepekovic/STATS stats-board

      - name: Pull data, render board, email PNG
        env:
          TABLEAU_SERVER: ${{ secrets.TABLEAU_SERVER }}
          TABLEAU_SITE: ${{ secrets.TABLEAU_SITE }}
          TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
          TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STATS_DIR: stats-board
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python pull_render_email.py

      - name: Upload artifacts (board + raw CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-${{ github.run_number }}
          path: |
            board.png
            view_data.csv
          if-no-files-found: ignore
