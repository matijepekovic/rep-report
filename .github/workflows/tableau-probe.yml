# Temporary. Manual-dispatch only, no schedule, and no SMTP secrets are
# exposed to it, so it cannot email anything. Delete this file and
# probe_workbooks.py once the probe has answered.
name: Tableau Probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # probe_workbooks.py and the helper it imports need requests and
      # nothing else, so requirements.txt is skipped to keep Playwright and
      # its browser download out of a run that never renders anything.
      - run: pip install requests

      - name: Probe Tableau workbook listing
        env:
          TABLEAU_SERVER: ${{ secrets.TABLEAU_SERVER }}
          TABLEAU_SITE: ${{ secrets.TABLEAU_SITE }}
          TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
          TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
        run: python probe_workbooks.py
